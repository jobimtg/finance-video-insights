name: 週報摘要
on:
  workflow_dispatch:
    inputs:
      week_end:
        description: "週五日期 YYYYMMDD"
        required: true
      send_line:
        description: "推送 LINE Flex 卡片（每週一則）"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: repo-write
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Build
        run: cd scripts && python weekly_report.py "${{ inputs.week_end }}"
      - name: Publish
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: cd scripts && python weekly_publish.py "${{ inputs.week_end }}" ${{ inputs.send_line && '--send-line' || '' }}
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add drafts/weekly_${{ inputs.week_end }} docs/weekly data/push_log.json 2>/dev/null || git add drafts docs
          git commit -m "週報 ${{ inputs.week_end }}" || exit 0
          git pull --rebase origin main && git push
