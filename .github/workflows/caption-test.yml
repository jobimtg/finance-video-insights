name: 字幕抓取測試（手動）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  captions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install requests==2.32.5 yt-dlp==2026.8.19
      - name: Run caption test
        run: python scripts/caption_test.py
